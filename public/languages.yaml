    code: it-IT
  - folder: polski
    code: pl-PL
  - folder: русский
    code: ru-RU
  - folder: українська
    code: uk-UA
  - folder: türkçe
    code: tr-TR
  - folder: العربية
    code: ar-SA
  - folder: فارسی
    code: fa-IR
  - folder: اردو
    code: ur-PK
  - folder: हिन्दी
    code: hi-IN
